<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Holm app icon. Flat, hand-written, no font and no external reference.
       Colours come from the app's theme: egui dark panel #1b1b1b and the
       strength-meter green #2e9d4f (crates/holm-gui/src/widgets/strength_meter.rs). -->
  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="#1b1b1b"/>
  <!-- The H: two stems and a crossbar, drawn as plain rectangles. -->
  <rect x="302" y="272" width="120" height="480" fill="#2e9d4f"/>
  <rect x="602" y="272" width="120" height="480" fill="#2e9d4f"/>
  <rect x="302" y="452" width="420" height="120" fill="#2e9d4f"/>
</svg>
