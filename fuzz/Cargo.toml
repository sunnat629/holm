# Fuzz targets for holm-core. Never shipped. Its own workspace (the root
# Cargo.toml excludes it) so libfuzzer-sys stays out of the product graph.
[workspace]

[package]
name = "holm-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99.1"
publish = false
description = "cargo-fuzz targets for Holm (never shipped)"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
holm-core = { path = "../crates/holm-core", features = ["fuzzing"] }
holm-crypto = { path = "../crates/holm-crypto" }

[[bin]]
name = "parse_header"
path = "fuzz_targets/parse_header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_header_v2"
path = "fuzz_targets/parse_header_v2.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_header_structured"
path = "fuzz_targets/parse_header_structured.rs"
test = false
doc = false
bench = false

[[bin]]
name = "unpad"
path = "fuzz_targets/unpad.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_fixed_key"
path = "fuzz_targets/open_fixed_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_v2_fixed_key"
path = "fuzz_targets/open_v2_fixed_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_body"
path = "fuzz_targets/decode_body.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_index"
path = "fuzz_targets/decode_index.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_record"
path = "fuzz_targets/decode_record.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_body_v1"
path = "fuzz_targets/decode_body_v1.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_csv"
path = "fuzz_targets/import_csv.rs"
test = false
doc = false
bench = false

[[bin]]
name = "import_json"
path = "fuzz_targets/import_json.rs"
test = false
doc = false
bench = false

[lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
opt-level = 3
