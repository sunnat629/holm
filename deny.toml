# cargo-deny policy for Holm. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Defaults: vulnerabilities and unmaintained crates are errors.
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# No network code in Holm. None of these may enter the dependency graph.
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "h2" },
    { crate = "ureq" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "surf" },
    { crate = "attohttpc" },
    { crate = "tokio" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "tokio-rustls" },
    { crate = "tungstenite" },
    { crate = "async-tungstenite" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
