# cargo-deny policy for Holm. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Defaults: vulnerabilities and unmaintained crates are errors.
version = 2

[licenses]
version = 2
# Only licences that a dependency in the graph actually uses. When a new dependency needs
# another one (ISC, BSD-2-Clause, CC0-1.0, Apache-2.0 WITH LLVM-exception ...), add it back
# with the reason in the same commit.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# No network code in Holm. None of these may enter the dependency graph.
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "h2" },
    { crate = "ureq" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "surf" },
    { crate = "attohttpc" },
    { crate = "tokio" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "tokio-rustls" },
    { crate = "tungstenite" },
    { crate = "async-tungstenite" },
    { crate = "minreq" },
    { crate = "ehttp" },
    { crate = "http_req" },
    { crate = "chttp" },
    { crate = "awc" },
    { crate = "actix-web" },
    { crate = "warp" },
    { crate = "axum" },
    { crate = "tiny_http" },
    { crate = "rouille" },
    # Deliberate: mio is the socket event loop under tokio and friends. The ban also blocks
    # crossterm and notify. If a TUI or file-watch task needs them, decide that on purpose.
    { crate = "mio" },
    { crate = "socket2" },
    { crate = "smol" },
    { crate = "async-net" },
    # No telemetry, self-update, extra async runtimes, DNS/QUIC stacks or git transport.
    { crate = "sentry" },
    { crate = "self_update" },
    { crate = "opentelemetry" },
    { crate = "opentelemetry-otlp" },
    { crate = "opentelemetry_sdk" },
    { crate = "async-std" },
    { crate = "hickory-resolver" },
    { crate = "hickory-proto" },
    { crate = "quinn" },
    { crate = "git2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
