# cargo-deny policy for Holm. Run with `cargo deny check`.

[graph]
all-features = true
# Only the desktop triples Holm ships for. Without this, deny walks every target, and
# winit's wasm-only path pulls the banned tokio in through wasm-bindgen-futures.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]

[advisories]
# Defaults: vulnerabilities and unmaintained crates are errors.
version = 2
# Unmaintained notices (not vulnerabilities) for the zbus 5 family, merged into zbus 6.
# They reach the lockfile only through accesskit_winit -> accesskit_unix (Linux AT-SPI),
# and holm-gui's GUI stack is a macOS-only dependency, so no Holm build compiles them
# (`cargo tree -p holm-gui --target <each desktop triple> -i zbus` prints nothing).
# Revisit when the Linux GUI lands (Phase 5) or eframe moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant: Linux-only accesskit_unix path, never built by Holm (Phase 3 GUI is macOS-only)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: Linux-only accesskit_unix path, never built by Holm (Phase 3 GUI is macOS-only)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: Linux-only accesskit_unix path, never built by Holm (Phase 3 GUI is macOS-only)" },
]

[licenses]
version = 2
# Only licences that a dependency in the graph actually uses. When a new dependency needs
# another one (ISC, BSD-2-Clause, CC0-1.0, Apache-2.0 WITH LLVM-exception ...), add it back
# with the reason in the same commit.
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
    # Permissive. Only clipboard-win and error-code (arboard's Windows back end) use it.
    # arboard is a macOS-only dependency of holm-gui, so neither is built in Phase 3.
    "BSL-1.0",
]
# ISC is permissive, but it is allowed for one crate only, not added to `allow`:
# libloading IS built on macOS (eframe turns on glutin's `egl` feature, which pulls it in),
# so it ships in the Holm.app binary. On Linux it would also come through wayland's dlib.
exceptions = [
    { crate = "libloading", allow = ["ISC"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# No network code in Holm. None of these may enter the dependency graph.
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "hyper-util" },
    { crate = "h2" },
    { crate = "ureq" },
    { crate = "isahc" },
    { crate = "curl" },
    { crate = "curl-sys" },
    { crate = "surf" },
    { crate = "attohttpc" },
    { crate = "tokio" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "tokio-rustls" },
    { crate = "tungstenite" },
    { crate = "async-tungstenite" },
    { crate = "minreq" },
    { crate = "ehttp" },
    { crate = "http_req" },
    { crate = "chttp" },
    { crate = "awc" },
    { crate = "actix-web" },
    { crate = "warp" },
    { crate = "axum" },
    { crate = "tiny_http" },
    { crate = "rouille" },
    # Deliberate: mio is the socket event loop under tokio and friends. The ban also blocks
    # crossterm and notify. If a TUI or file-watch task needs them, decide that on purpose.
    { crate = "mio" },
    { crate = "socket2" },
    { crate = "smol" },
    { crate = "async-net" },
    # No telemetry, self-update, extra async runtimes, DNS/QUIC stacks or git transport.
    { crate = "sentry" },
    { crate = "self_update" },
    { crate = "opentelemetry" },
    { crate = "opentelemetry-otlp" },
    { crate = "opentelemetry_sdk" },
    { crate = "async-std" },
    { crate = "hickory-resolver" },
    { crate = "hickory-proto" },
    { crate = "quinn" },
    { crate = "git2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
