[[exemptions.borsh-derive]]
version = "1.8.1"
criteria = "safe-to-run"
notes = "Dev-only, kept exempt (safe-to-run). In Cargo.lock only as an optional dependency of bit-vec (proptest dev tree); `cargo tree -e all --target all` shows it is not built for Holm. It is a 5.6k-line proc-macro with no runtime presence. Risk accepted: none at runtime, theoretical build-time code execution if a future feature change ever activates it. Kept at the Phase 2 supply-chain review (#13): no imported audit, and no imported set trusts its publisher (nearprotocol-ci). Revisit if it starts being built (cargo tree shows it)."

[[exemptions.proptest]]
version = "1.12.0"
criteria = "safe-to-run"
notes = "Dev-only, kept exempt (safe-to-run). Dev-dependency of holm-core for property tests; it is 27k lines with no imported audit of 1.12. Never part of a shipped binary. It uses fork/timeout (rusty-fork, already delta-audited), tempfile and regex-syntax at test time. Risk accepted: malicious code running on developer and CI machines during cargo test. Kept at the Phase 2 supply-chain review (#13): no imported set trusts its publisher (rexmas). Revisit when an imported audit covers proptest 1.12."

[[exemptions.r-efi]]
version = "6.0.0"
criteria = "safe-to-deploy"
notes = """Unused target, kept exempt (safe-to-deploy). A dependency of getrandom only on target_os = "uefi" (the efi_rng backend), which Holm never builds; it is in Cargo.lock only because the lockfile spans every target. It is 10k lines of UEFI type and protocol definitions. Risk accepted: none for Holm's macOS/Linux/Windows targets. Revisit only if a UEFI target is ever added."""
