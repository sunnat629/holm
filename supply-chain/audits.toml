[[audits.chacha20]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
delta = "0.10.0 -> 0.10.2"
notes = "Delta reviewed in full (src/, backends/neon.rs, backends/sse2.rs, Cargo.toml). Unsafe: NEON backend goes from 4 to 8 parallel blocks; I checked the 8 counter offsets (state, ctrs[0..7], then advance by 8) and that vst1q_u8 writes 4 x 16 bytes inside each 64-byte block (offset() changed to add() on usize). SSE2 load and store moved into Backend::new and save_ctr; save_ctr stores the whole row 3, which is equal to the old per-word stores because the counter adds only touch counter lanes. Other changes are re-exports and docs. Holm's KAT and Wycheproof tests pass on this version. No build script, no new dependencies, no filesystem, network, env or process access. Secret handling: key and state zeroize-on-drop unchanged; ParBlocks keystream temporaries on the stack are not wiped (unchanged pattern, now 512 bytes on aarch64)."

[[audits.chacha20poly1305]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
version = "0.11.0"
notes = "Full review of src/lib.rs and src/cipher.rs (431 lines). No unsafe code, no build script, no_std with no filesystem, network, env or process access. Checked: Poly1305 key comes from keystream block 0 and is zeroized after use (zeroize feature), keystream then seeks to block 1; decrypt verifies the tag (poly1305 constant-time verify) before applying the keystream, so no plaintext is released on failure; AD and ciphertext lengths are bound in the final block; inputs >= 2^32 blocks are rejected. Key is zeroized on Drop when the zeroize feature is on (Holm enables it, which also enables chacha20/zeroize). Debug impl prints no key material."

