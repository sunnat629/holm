[[audits.poly1305]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
version = "0.9.1"
notes = """Full audit of poly1305 0.9.1 (RustCrypto). No build.rs, no I/O, no filesystem/network/process access, no_std. Soft backend (the only one compiled on Holm's aarch64 primary target) is 100% safe Rust: poly1305-donna 26-bit limb arithmetic, u64 products cannot overflow given clamped r and reduced h, final reduction mod 2^130-5 uses a branch-free mask select, so it is constant time; the only branch is on the public partial-block flag. Key clamping matches RFC 8439. x86/x86_64 only: the AVX2 backend is selected through a cpufeatures runtime token and a ManuallyDrop union; every union access is gated on that same token, and the #[target_feature(enable="avx2")] fns are only reachable after detection. AVX2 loads/stores reviewed: loadu_si256 on the 32-byte key and on 2x16-byte block halves, loadu_si128 on 16-byte blocks, storeu into 32-byte arrays or the 16-byte tag, all in bounds. Drop zeroizes the whole Poly1305 via zeroize_flat_type when the zeroize feature is on; Holm enables it (direct dependency purely to unify that feature), and State holds only plain integer arrays, so the flat-type precondition holds. Debug impl prints no key material."""

