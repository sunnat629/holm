notes = "Delta reviewed for the safe-to-deploy criteria: the crate is still #![forbid(unsafe_code)] (checked lib.rs), so there is no unsafe to reason about. Most of the delta is a rustfmt change and removing the 9.6k-line generated array impl in favour of const generics. Read Cargo.toml, lib.rs and array.rs in full and skimmed arrayvec/tinyvec/slicevec; I did not do a full logic review of the reformatted collection code. New optional dependencies (borsh, schemars, bin-proto, defmt, serde_core, generic-array) are not enabled in Holm, which uses only alloc via unicode-normalization. fuzz/ is not built. No build script, no filesystem, network, env or process access. Secret handling: none."

