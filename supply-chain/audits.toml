[[audits.hybrid-array]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
version = "0.4.15"
notes = "Full audit of hybrid-array 0.4.15 (RustCrypto), focused on all unsafe in lib.rs, from_fn.rs, flatten.rs, traits.rs and sizes.rs. No build.rs, no I/O, no_std, no FFI. Holm builds only the default features (no alloc, serde, bytemuck, zerocopy, zeroize, subtle or ctutils). Every unsafe block relies on Array being repr(transparent) over U::ArrayType<T> = [T; N], with N == U::USIZE; that relies on the unsafe ArraySize trait, which is implemented only by this crate's impl_array_sizes macro (which also emits a USIZE == len test). Reviewed: as_slice/as_mut_slice, slice_as_array/TryFrom (length checked before the cast), slice_as_chunks (non-zero chunk assert, tail_pos <= len), slice_as_flattened (checked_mul), split/split_ref/split_ref_mut (N <= U is enforced at the type level by typenum Sub; ManuallyDrop avoids a double drop), concat (writes every slot before assume_init), uninit (MaybeUninit array), assume_init (transmute_copy of an owned MaybeUninit array), try_from_fn Guard (drops only the initialized prefix on error or panic; push bounded by the loop condition), and flatten/unflatten (Prod/Quot sizes with Rem == 0 enforced by the type). Send/Sync impls match [T; N]. Array has no Drop and no zeroize-on-drop; wiping secrets held in Arrays is the caller's responsibility (Holm and RustCrypto wrap them in zeroize types)."

