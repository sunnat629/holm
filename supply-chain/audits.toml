
# cargo-vet audits file

[[audits.aead]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
version = "0.6.1"
notes = "Full review of src/lib.rs (dev.rs is behind the unused dev feature and only loads test vectors with include_bytes). forbid(unsafe_code), no build script, no_std. Trait glue only: Aead::encrypt pre-reserves msg+tag capacity so no reallocation leaves plaintext copies; decrypt_in_place checks length with checked_sub and truncates the tag only after decrypt_inout_detached succeeds. No filesystem, network, env or process access; optional getrandom is reached only via crypto-common."

[[audits.argon2]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
version = "0.6.0"
notes = """Full audit of argon2 0.6.0 (RustCrypto). No build.rs, no filesystem/network/process access, no logging of inputs. unsafe reviewed: (1) compress_avx2 is #[target_feature(enable="avx2")] and only called when the cpufeatures AVX2 token is set (x86 only; not compiled on Holm's aarch64 primary target); (2) SegmentView get_block/get_block_mut assert index bounds and lane/segment disjointness before raw pointer add, which makes the parallel-lane aliasing sound; (3) unsafe impl Send/Sync for the memory view is justified by that disjointness; (4) block::Blocks uses alloc_zeroed(Layout::array) and dealloc with the same layout. Zeroization: initial_hash (H0) and the finalize blockhash/blockhash_bytes are wiped when the zeroize feature is on (Holm enables it). FINDING: the crate-owned Blocks allocation used by hash_password_into is freed WITHOUT wiping the memory matrix. Holm avoids this on the production path by calling hash_password_into_with_memory with its own Zeroizing<Vec<Block>> work area (holm-crypto kdf.rs); the unwiped hash_password_into is only used by the cfg(test)/test-vectors argon2id_raw helper. Parameter validation (m >= 8*p, output/salt/secret length limits) checked. Safe to deploy as used by Holm."""

