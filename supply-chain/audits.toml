[[audits.block-buffer]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
delta = "0.10.4 -> 0.12.1"
notes = "Delta reviewed by reading the new src/lib.rs, sealed.rs and read.rs in full. Unsafe: buffer is now MaybeUninit with the eager position stored in the last byte; I checked every ptr::copy_nonoverlapping/write_bytes against the Eager (pos < BS) and Lazy (pos <= BS) invariants, the ResetGuard that restores the invariant if compress or gen_block panics, Lazy split_blocks keeping a full last block, (de)serialize bounds, and the unreachable_unchecked in get_pos, which only fires if those invariants are broken. Clone uses ptr::read although a Drop impl now exists; sound because the type owns only plain bytes (stale comment). BlockSizes is sealed to U1..U255, so the u8 position never truncates. No build script, no filesystem, network, env or process access. Secret handling: new optional zeroize feature wipes BlockBuffer and ReadBuffer on drop."

