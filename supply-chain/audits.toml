[[audits.typenum]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
version = "1.20.1"
notes = "Audit of typenum 1.20.1. #![no_std] and #![forbid(unsafe_code)] at the crate root, no build.rs (the generated files under src/gen are checked in), no proc-macros, no extern/link/no_mangle/asm, no filesystem, network, process or env access. The only optional dependency is scale-info, which Holm does not enable; Holm gets only the const-generics feature through hybrid-array. The crate is type-level arithmetic: runtime code is limited to trivial to_u*/to_i* constant accessors and the operator impls on zero-sized marker types. Hand-written modules (bit, uint, int, type_operators, marker_traits, operator_aliases, array) were reviewed for logic. The 11k lines of generated consts.rs and generic_const_mappings.rs were checked by pattern (only type aliases, impl blocks and cfg(target_pointer_width) attributes), not line by line. It handles no secrets and does no I/O."

[[audits.unicode-ident]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
delta = "1.0.18 -> 1.0.27"
notes = "Delta reviewed: lib.rs read in full; tables.rs is regenerated Unicode 18 data. Unsafe: the two LEAF.get_unchecked lookups now add LEAF_START/LEAF_CONTINUE base offsets; I parsed the shipped tables and checked that the largest reachable offset (5215 and 8063) is below LEAF's length 8064 and that the ZERO_* fallback indices are in range. ASCII path now uses u128 bitmasks (shift < 128). No build script, no new runtime dependencies, no filesystem, network, env or process access. Secret handling: not applicable."

[[audits.universal-hash]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
delta = "0.5.1 -> 0.6.1"
notes = "Delta reviewed in full (src/lib.rs, Cargo.toml). Moves from deny to forbid(unsafe_code): the only unsafe block (to_blocks via slice::from_raw_parts) is replaced by the safe Array::slice_as_chunks. Tag verify now uses ctutils::CtEq instead of subtle::ConstantTimeEq, still constant time (ctutils is reviewed separately). Dependencies change to crypto-common 0.2 and ctutils 0.4, std feature dropped for core::error::Error. No build script, no filesystem, network, env or process access. Secret handling: no new copies of key or state."

[[audits.zeroize]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
delta = "1.8.2 -> 1.9.1"
notes = "Delta reviewed in full (src/lib.rs, barrier.rs, stack.rs, x86.rs, aarch64.rs, Cargo.toml). Unsafe: new optimization_barrier uses an empty asm! that only takes the pointer in a register (readonly, nostack) or a 1-byte read_volatile fallback; volatile_set unsafe blocks only re-wrapped for edition 2024; compiler_fence(SeqCst) after volatile writes removed, which does not let the compiler elide the volatile writes. Vec zeroize now wipes spare capacity before the elements, same coverage. Zeroizing Debug no longer prints the inner secret. No build script, no new dependencies, no filesystem, network, env or process access. Secret handling: no copies or logging of zeroized data introduced."

[[audits.zeroize_derive]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
delta = "1.4.2 -> 1.5.0"
notes = "Delta reviewed in full (src/lib.rs, Cargo.toml). Still #![forbid(unsafe_code)]; changes are edition 2024 migration, panic format strings, panic-to-assert rewrites and one extra allow(unused_assignments) on generated match arms. Generated Zeroize and Drop code is unchanged, so every field is still wiped. No build script, no new dependencies, no filesystem, network, env or process access at expansion time. Secret handling: the macro never sees runtime data."

[[audits.zmij]]
