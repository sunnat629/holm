[[audits.getrandom]]
who = "Holm maintainers (AI-assisted audit)"
criteria = "safe-to-deploy"
version = "0.4.3"
notes = 'Full audit of getrandom 0.4.3, scoped to the backends Holm ships on (macOS, Linux gnu/musl, Windows) plus all shared code. build.rs only reads CARGO_CFG_SANITIZE and emits a getrandom_msan cfg: no file, network or process access. Holm uses only getrandom::fill (holm-crypto random.rs), with no features enabled and no getrandom_backend cfg override in the repo. macOS: getentropy(2) in 256-byte chunks, -1 maps errno, any other return is UNEXPECTED. Linux: dlsym(RTLD_DEFAULT, "getrandom") (a direct fn on musl), probed with a zero-length call; ENOSYS or EPERM (seccomp) falls back to /dev/urandom, opened O_CLOEXEC only after poll() on /dev/random shows the pool is initialized, with a single futex-guarded FD init. sys_fill_exact loops until the buffer is full, retries EINTR, bounds-checks the returned length with split_at_mut_checked, and treats 0 or other negative returns as errors, so a short read can never be returned as success. Windows: ProcessPrng from bcryptprimitives (raw-dylib), checked against TRUE. Shared unsafe reviewed: the MaybeUninit slice casts in util.rs (fill writes every byte before assume_init), the errno pointer read, the LazyPtr/LazyBool relaxed atomics (idempotent init), and NonZero new_unchecked on constants offset from a positive base. No logging of output; the crate stores no secrets. Exotic-platform backends (linux_raw asm, rdrand, rndr, efi_rng, wasm, wasi, etc.) were skimmed, not line-audited; they are not compiled for Holm targets.'

