[workspace]
resolver = "3"
members = [
    "crates/holm-crypto",
    "crates/holm-core",
    "crates/holm-platform",
    "crates/holm-cli",
    "crates/holm-gui",
]
# Separate workspaces (own lockfiles): libsodium oracle tests and cargo-fuzz.
exclude = ["oracle", "fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.99.1"
repository = "https://github.com/sunnat629/holm"

[workspace.lints.rust]
unsafe_code = "forbid"
# cargo-fuzz sets `--cfg fuzzing`; holm-core checks it to forbid its `fuzzing` feature elsewhere.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.dependencies]
# Internal crates
holm-crypto = { path = "crates/holm-crypto", version = "0.1.0" }
holm-core = { path = "crates/holm-core", version = "0.1.0" }
holm-platform = { path = "crates/holm-platform", version = "0.1.0" }

# Runtime
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["alloc", "zeroize"] }
# Direct dep only to unify features: chacha20poly1305 does not enable poly1305/zeroize
# itself, so the MAC key and state would not be wiped. Keep this line.
poly1305 = { version = "0.9", default-features = false, features = ["zeroize"] }
# Direct dep only to unify features: argon2 does not enable blake2/zeroize itself,
# so its BLAKE2b hash state would not be wiped. Keep this line.
blake2 = { version = "0.11", default-features = false, features = ["zeroize"] }
zeroize = { version = "1.9", features = ["derive"] }
getrandom = "0.4"
unicode-normalization = "0.1"
serde = { version = "1", default-features = false, features = ["std", "derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
thiserror = "2"
subtle = "2.6"
zxcvbn = { version = "3", default-features = false }
# holm-platform on Unix: the no-echo password prompt (`tty` feature, termios) and
# disabling core dumps (`process`). Pinned to the version the GUI graph already
# locks, so neither use adds a crate to Cargo.lock.
rustix = { version = "=1.1.5", default-features = false, features = ["std", "termios", "process"] }

# GUI (holm-gui, macOS target only). Exact pins: a GUI bump is a reviewed change.
# eframe: `glow` renderer and `accesskit` (spec §10 screen readers) only. Off on purpose:
# default_fonts, persistence, clipboard (pulls arboard's image decoders), wgpu, wayland,
# x11, web_screen_reader, links, system_fonts. egui comes through `eframe::egui`.
# Note: eframe 0.37 always depends on `image` with `png` on non-wasm targets, so a PNG
# decoder ships in the macOS binary even with `clipboard` off.
eframe = { version = "=0.37.0", default-features = false, features = ["glow", "accesskit"] }
# Plain-text clipboard only; Holm calls it itself (no image support).
arboard = { version = "=3.7.0", default-features = false }
# holm-platform's macOS-only `gui-window` feature (holm-gui only): reads the window's
# minimised state from AppKit. Pinned to the versions eframe already pulls in, so the
# feature adds no crate to the graph.
raw-window-handle = { version = "=0.6.2", default-features = false, features = ["std"] }
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSResponder", "NSView", "NSWindow", "NSWorkspace", "NSApplication"] }
# The same feature's OS lock events (sleep, screen lock, user switch): notification
# observers with a block. Both are already in the graph through objc2-app-kit and eframe.
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSNotification", "NSDistributedNotificationCenter", "NSOperation", "NSString", "NSTimeZone", "block2"] }
block2 = { version = "=0.6.2", default-features = false, features = ["std"] }
# Native open and save dialogs (holm-gui, macOS only). No default features: no async
# runtime, no xdg-portal, no GTK. Newest release at least 14 days old when added.
rfd = { version = "=0.17.2", default-features = false }

# Dev and test only
proptest = "1.12"
hex = "0.4"
serde_json = "1"
static_assertions = "1.1"
# Throwaway directories for holm-platform tests. Already in the graph through proptest.
tempfile = "3"
# Headless egui tests for holm-gui (macOS only).
egui_kittest = { version = "=0.37.0", default-features = false }

# Argon2 is slow in unoptimised builds. Optimise dependencies even in dev
# so tests that derive keys stay fast. Our own code stays easy to debug.
[profile.dev.package."*"]
opt-level = 3

# Fat LTO and one codegen unit let the compiler see the whole program and
# shrink the release binary. Symbols and debug info are stripped, so a shipped
# build does not carry source paths. Panic stays on unwind: the GUI worker
# wakes the UI when its thread unwinds, and Throttle's panic test needs
# catch_unwind. Setting panic to abort would skip both.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
