[package]
name = "holm-platform"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Holm platform code: the vault file on disk, with durable writes"

# The workspace lints, except `unsafe_code` is `deny` here, not `forbid`, so the one
# module behind `gui-window` can allow it. Every other module carries its own
# `#![forbid(unsafe_code)]`, because a `--workspace` build turns the feature on. Keep the rest in step with [workspace.lints.rust].
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[features]
default = []
# The window's minimised state and the sleep, screen lock and logout events, read from
# AppKit (macOS only; the deps are target-gated,
# so elsewhere this feature compiles nothing). For holm-gui. holm-cli does not request it; in a `--workspace` build, feature
# unification turns it on for every member.
gui-window = [
    "dep:raw-window-handle",
    "dep:objc2",
    "dep:objc2-app-kit",
    "dep:objc2-foundation",
    "dep:block2",
]
# The no-echo terminal prompt for holm-cli (Unix only; elsewhere `tty` reports
# `Unsupported`). Uses rustix's safe termios API, so the crate stays free of `unsafe`.
tty = ["dep:rustix"]
# The concealed clipboard for holm-cli's `--copy` (macOS only; the dep is target-gated,
# so elsewhere `clipboard::ConcealedClipboard::open` reports `Unavailable`). arboard's
# safe API marks each copy `org.nspasteboard.ConcealedType`.
clipboard = ["dep:arboard"]

[dependencies]
holm-core.workspace = true
holm-crypto.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = { workspace = true, optional = true }
objc2 = { workspace = true, optional = true }
objc2-app-kit = { workspace = true, optional = true }
objc2-foundation = { workspace = true, optional = true }
block2 = { workspace = true, optional = true }
arboard = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
