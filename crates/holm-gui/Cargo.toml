[package]
name = "holm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Holm desktop app (macOS for now), built on egui"

[[bin]]
name = "holm-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
holm-core.workspace = true
holm-crypto.workspace = true
holm-platform = { workspace = true, features = ["gui-window"] }
zeroize.workspace = true

# The GUI stack is built on macOS only. Linux and Windows compile an empty library and
# a binary that says the window is macOS-only for now (Phase 3).
[target.'cfg(target_os = "macos")'.dependencies]
eframe.workspace = true
arboard.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
egui_kittest.workspace = true

[dev-dependencies]
tempfile.workspace = true
static_assertions.workspace = true
