[package]
name = "holm-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
description = "Holm desktop app (macOS for now), built on egui"

[[bin]]
name = "holm-gui"
path = "src/main.rs"

[lints]
workspace = true

[features]
# Test-only hooks (`HolmApp::with_spawner`). Enabled for this crate's own tests through
# the self dev-dependency below; a normal or release build never turns it on.
test-hooks = []

[dependencies]
holm-core.workspace = true
holm-crypto.workspace = true
holm-platform = { workspace = true, features = ["gui-window"] }
zeroize.workspace = true

# The GUI stack is built on macOS only. Linux and Windows compile an empty library and
# a binary that says the window is macOS-only for now (Phase 3).
[target.'cfg(target_os = "macos")'.dependencies]
eframe.workspace = true
holm-platform = { workspace = true, features = ["clipboard"] }

[target.'cfg(target_os = "macos")'.dev-dependencies]
egui_kittest.workspace = true

[dev-dependencies]
holm-gui = { path = ".", features = ["test-hooks"] }
tempfile.workspace = true
static_assertions.workspace = true
